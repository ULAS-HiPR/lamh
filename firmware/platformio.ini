; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:stm32f072c8t6]
platform = ststm32
board = stm32f072c8t6
framework = stm32cube

lib_deps = 
    FreeRTOS
build_flags =
  -DSTM32F072xB
  -D STM32F0
  -D STM
  -D F0
  -DCOMHEADAN_USE_SERVO_DEBUG
  -DBRAITEOIRI_USE_SERVO_DEBUG
  -I lib/FreeRTOS/include
  -I lib/FreeRTOS/CMSIS_RTOS_V2_f0
  -I lib/FreeRTOS/portable/GCC/ARM_CM0 
  -Iinclude
  -Wl,-Map=.pio/build/memory.map

build_src_filter =
    +<*>
    -<input_pin_probe.cpp>

lib_archive = no
lib_ldf_mode = deep+

check_tool = clangtidy, cppcheck

check_src_filters =
    +<src/**>
    -<lib/**>
    -<.pio/**>
    -<lib/FreeRTOS/include/*>
    -<lib/FreeRTOS/CMSIS_RTOS_V2/*>
    -<lib/FreeRTOS/portable/GCC/ARM_CM4F/*>

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
  
[env:sil]
platform = native
test_build_src = no
lib_ldf_mode = chain+
lib_ignore =
    braiteoiri
    comheadan

lib_archive = no

build_flags = 
    -std=gnu++17
    -DUNIT_TEST
    -Ilib/comheadan/include/
    -Iinclude


[env:stm32f072c8t6_input_probe]
platform = ststm32
board = stm32f072c8t6
framework = stm32cube

build_flags =
  -DSTM32F072xB
  -D STM32F0
  -D STM
  -D F0

build_src_filter =
    +<input_pin_probe.cpp>
    -<main.cpp>
    -<servo_debug.cpp>
    -<tasks/**>
    -<platform/**>

upload_protocol = stlink
debug_tool = stlink
